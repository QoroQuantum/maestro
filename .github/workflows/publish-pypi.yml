name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: "Skip CI tests / build (cmake-multi-platform)"
        type: boolean
        default: false
      from_run_id:
        description: "Optional: existing run ID to publish artifacts from (skips building)"
        type: string
        default: ""
      publish:
        description: "Upload to PyPI and create the GitHub release (untick for a dry run)"
        type: boolean
        default: true

# Dry runs cancel each other; publishing runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && 'publish' || 'dry' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}

env:
  VIRTUALENV_VERSION: "20.27.1"
  VCPKG_CACHE_KEY: vcpkg-windows-x64-deps2-lapack
  VCPKG_CACHE_PATHS: |
    C:/vcpkg/installed
    C:/vcpkg/binary-cache
  VCPKG_TOOLCHAIN: C:/vcpkg/scripts/buildsystems/vcpkg.cmake
  WINDOWS_WHEEL_BIN_PATHS: "build\\cp310-cp310-win_amd64\\bin;build\\cp311-cp311-win_amd64\\bin;build\\cp312-cp312-win_amd64\\bin;build\\cp313-cp313-win_amd64\\bin;build\\cp314-cp314-win_amd64\\bin"
  MACOS_DYLD_PATH: $(brew --prefix)/lib:$(brew --prefix openblas)/lib:$(brew --prefix libomp)/lib

jobs:
  # CI tests run alongside the builds and must pass before upload (unless skipped)
  ci:
    name: Run CI tests
    if: ${{ !inputs.skip_ci && !inputs.from_run_id }}
    uses: ./.github/workflows/cmake-multi-platform.yml

  # Single source of the version being published, for both triggers: a release
  # whose tag disagrees with pyproject.toml fails here, before anything builds.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match pyproject.toml version $tag"
            exit 1
          fi

  build_sdist:
    name: Build source distribution
    needs: [version]
    if: always() && !cancelled() && !inputs.from_run_id && needs.version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v6
        with:
          name: maestro-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.cibw_build }})
    needs: [version]
    if: always() && !cancelled() && !inputs.from_run_id && needs.version.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows builds one CPython per job; Linux and macOS build all five in one.
      matrix:
        os: [windows-2022]
        cibw_build: ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
        include:
          - os: ubuntu-latest
            cibw_build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          - os: macos-14
            cibw_build: "cp310-* cp311-* cp312-* cp313-* cp314-*"

    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC x64 toolset not found" }
          $before = cmd /c set
          $after = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          # Export only variables vcvars added or changed; unchanged multi-line values stay untouched.
          Compare-Object $before $after | Where-Object { $_.SideIndicator -eq '=>' -and $_.InputObject -match '^[^=]+=' } |
            ForEach-Object { $_.InputObject >> $env:GITHUB_ENV }

      - name: Cache cibuildwheel virtualenv
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/cibuildwheel
            ~/.cache/cibuildwheel
            ~\AppData\Local\pypa\cibuildwheel\Cache
          key: cibw-virtualenv-${{ env.VIRTUALENV_VERSION }}

      - name: Pre-download virtualenv (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            CACHE_DIR=~/Library/Caches/cibuildwheel
          else
            CACHE_DIR=~/.cache/cibuildwheel
          fi
          mkdir -p "$CACHE_DIR"
          if [ ! -f "$CACHE_DIR/virtualenv-$VIRTUALENV_VERSION.pyz" ]; then
            curl -L --retry 5 --retry-delay 10 --retry-all-errors \
              -o "$CACHE_DIR/virtualenv-$VIRTUALENV_VERSION.pyz" \
              "https://github.com/pypa/get-virtualenv/blob/$VIRTUALENV_VERSION/public/virtualenv.pyz?raw=true"
          fi

      - name: Pre-download virtualenv (Windows)
        if: runner.os == 'Windows'
        run: |
          $CacheDir = "$env:USERPROFILE\AppData\Local\pypa\cibuildwheel\Cache"
          New-Item -ItemType Directory -Force -Path $CacheDir | Out-Null
          $VenvPath = "$CacheDir\virtualenv-$env:VIRTUALENV_VERSION.pyz"
          if (-not (Test-Path $VenvPath)) {
            $headers = @{ Authorization = "token $env:GITHUB_TOKEN" }
            $retries = 5
            for ($i = 0; $i -lt $retries; $i++) {
              try {
                Invoke-WebRequest -Uri "https://github.com/pypa/get-virtualenv/blob/$env:VIRTUALENV_VERSION/public/virtualenv.pyz?raw=true" -Headers $headers -OutFile $VenvPath
                break
              } catch {
                if ($i -lt $retries - 1) { Start-Sleep -Seconds 10 }
                else { throw }
              }
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        id: cache-vcpkg
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_CACHE_PATHS }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Unset VCPKG env (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLATION_ROOT=" >> $env:GITHUB_ENV
        # Suppresses "ignoring mismatched VCPKG_ROOT" when runner has VS vcpkg path set

      - name: Configure git auth for vcpkg (Windows)
        if: runner.os == 'Windows' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          git config --global credential.https://github.com.helper '!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        id: install-dependencies
        run: |
          # In-process removal: the earlier unset only reaches later steps.
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:VCPKG_INSTALLATION_ROOT -ErrorAction SilentlyContinue
          # Reconcile restored caches too; always use the same vcpkg as CMake.
          & "C:/vcpkg/vcpkg.exe" install boost-json:x64-windows boost-program-options:x64-windows boost-container:x64-windows boost-serialization:x64-windows openblas:x64-windows lapack-reference:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency installation failed" }
        env:
          VCPKG_BINARY_SOURCES: "clear;files,C:/vcpkg/binary-cache,readwrite"

      - name: Save vcpkg cache (Windows)
        if: runner.os == 'Windows' && steps.install-dependencies.outcome == 'success' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_CACHE_PATHS }}
          key: ${{ env.VCPKG_CACHE_KEY }}

      - name: Set CMake env (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "$env:VCPKG_TOOLCHAIN")) {
            throw "vcpkg toolchain not found at $env:VCPKG_TOOLCHAIN. Ensure vcpkg is at C:\vcpkg on this runner."
          }
          # Let CMake discover and validate the installed OpenBLAS library.
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          echo "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_TOOLCHAIN -DMAESTRO_BUILD_REQUEST_TESTS=ON -DVCPKG_TARGET_TRIPLET=x64-windows -DAER_INCLUDE_DIR=C:/qiskit-aer/src" >> $env:GITHUB_ENV

      - name: Clone Qiskit Aer (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "C:\qiskit-aer")) {
            git clone --depth 1 https://github.com/QoroQuantum/qiskit-aer.git C:\qiskit-aer
          }
          echo "AER_INCLUDE_DIR=C:/qiskit-aer/src" >> $env:GITHUB_ENV

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # macOS builds on the host; Linux sets its container path below.
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"

          # ---- Linux ----
          CIBW_BEFORE_ALL_LINUX: >-
            (which yum >/dev/null 2>&1 && yum install -y openblas-devel || which dnf >/dev/null 2>&1 && dnf install -y openblas-devel || (apt-get update && apt-get install -y libopenblas-dev)) &&
            dnf install -y epel-release && dnf install -y ccache &&
            git clone --depth 1 https://github.com/QoroQuantum/qiskit-aer.git /tmp/qiskit-aer &&
            curl -L https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.gz -o /tmp/boost.tgz &&
            tar -xzf /tmp/boost.tgz -C /tmp &&
            cd /tmp/boost_1_90_0 &&
            ./bootstrap.sh --prefix=/usr/local &&
            ./b2 -j$(nproc) --with-program_options --with-json --with-container --with-serialization install

          # ccache reuses the Python-independent objects across CPython versions.
          CIBW_ENVIRONMENT_LINUX: >-
            AER_INCLUDE_DIR=/tmp/qiskit-aer/src
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            CCACHE_DIR=/tmp/ccache
            CCACHE_BASEDIR=/project
            CCACHE_NOHASHDIR=true
            CCACHE_MAXSIZE=2G

          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            rm -rf /tmp/auditwheel_out &&
            auditwheel repair -w /tmp/auditwheel_out {wheel} &&
            pip install wheel patchelf &&
            for whl in /tmp/auditwheel_out/*.whl; do
              rm -rf /tmp/whl_fix &&
              wheel unpack -d /tmp/whl_fix "$whl" &&
              find /tmp/whl_fix -name "maestro.cpython-*.so" -exec patchelf --force-rpath --add-rpath '$ORIGIN' {} + &&
              wheel pack -d {dest_dir} /tmp/whl_fix/* &&
              rm -rf /tmp/whl_fix "$whl";
            done &&
            rm -rf /tmp/auditwheel_out

          # ---- macOS ----
          CIBW_BEFORE_ALL_MACOS: >-
            brew install boost openblas libomp ccache &&
            git clone --depth 1 https://github.com/QoroQuantum/qiskit-aer.git /tmp/qiskit-aer

          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=14.0
            AER_INCLUDE_DIR=/tmp/qiskit-aer/src
            CMAKE_ARGS="-DOpenMP_ROOT=$(brew --prefix libomp) -DOpenBLAS_ROOT=$(brew --prefix openblas) -DCMAKE_PREFIX_PATH=$(brew --prefix openblas)"
            DYLD_FALLBACK_LIBRARY_PATH=${{ env.MACOS_DYLD_PATH }}
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache

          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            DYLD_FALLBACK_LIBRARY_PATH=${{ env.MACOS_DYLD_PATH }}
            delocate-wheel --require-archs {delocate_archs} --exclude libomp.dylib -w {dest_dir} -v {wheel}

          CIBW_ARCHS_MACOS: auto

          # ---- Windows ----
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ENVIRONMENT_WINDOWS: "CC=cl CXX=cl CMAKE_BUILD_PARALLEL_LEVEL=4 AER_INCLUDE_DIR=C:/qiskit-aer/src"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            pip install delvewheel &&
            delvewheel repair -w {dest_dir} --add-path "C:\vcpkg\installed\x64-windows\bin;${{ env.WINDOWS_WHEEL_BIN_PATHS }}" {wheel}

          # ---- Common ----
          CIBW_TEST_COMMAND: 'python -c "import maestro"'
          CIBW_BUILD: "${{ matrix.cibw_build }}"
          CIBW_SKIP: "*-musllinux_* *i686 *ppc64le *s390x"

      - name: Test native request DLL consumers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;" + $env:PATH
          $builds = @(Get-ChildItem build -Directory | Where-Object { Test-Path (Join-Path $_.FullName "CTestTestfile.cmake") })
          if ($builds.Count -eq 0) { throw "No native request test builds found" }
          foreach ($build in $builds) {
            ctest --test-dir $build.FullName -C Release --output-on-failure -R '^maestro_request_(abi|api|cli)$'
            if ($LASTEXITCODE -ne 0) { throw "Native request DLL test failed" }
          }

      - uses: actions/upload-artifact@v6
        with:
          name: maestro-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    name: Upload to PyPI
    needs: [ci, build_sdist, build_wheels]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.publish) && (inputs.from_run_id != '' || ((needs.ci.result == 'success' || needs.ci.result == 'skipped') && needs.build_sdist.result == 'success' && needs.build_wheels.result == 'success'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qoro-maestro
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Download artifacts from existing run
        if: ${{ inputs.from_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Builds run alongside CI, so replay only runs whose CI passed or was skipped.
          ci_results=$(gh api --paginate "repos/$GH_REPO/actions/runs/${{ inputs.from_run_id }}/jobs" \
            --jq '.jobs[] | select(.name | startswith("Run CI tests")) | .conclusion')
          if [ -z "$ci_results" ] || echo "$ci_results" | grep -qvxE 'success|skipped'; then
            echo "::error::CI did not pass in run ${{ inputs.from_run_id }}: ${ci_results:-no CI job found}"
            exit 1
          fi
          mkdir -p raw_artifacts dist
          gh run download "${{ inputs.from_run_id }}" --repo "${{ github.repository }}" -p "maestro*" -D raw_artifacts
          find raw_artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv -f {} dist/ \;
          rm -rf raw_artifacts
          ls -la dist/
          # Every platform must contribute the same, nonzero number of wheels, plus one sdist.
          linux=$(ls dist/*manylinux*.whl 2>/dev/null | wc -l)
          macos=$(ls dist/*macosx*.whl 2>/dev/null | wc -l)
          windows=$(ls dist/*win_amd64.whl 2>/dev/null | wc -l)
          sdists=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          if [ "$linux" -eq 0 ] || [ "$linux" -ne "$macos" ] || [ "$linux" -ne "$windows" ] || [ "$sdists" -ne 1 ]; then
            echo "::error::Incomplete artifacts in run ${{ inputs.from_run_id }}: linux=$linux macos=$macos windows=$windows sdist=$sdists"
            exit 1
          fi

      - name: Download artifacts from current run
        if: ${{ !inputs.from_run_id }}
        uses: actions/download-artifact@v7
        with:
          pattern: maestro-*
          path: dist
          merge-multiple: true

      - name: Publish package distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Every published version ends up with a release for it. Under the release
  # trigger one already exists and this is a no-op; a manual dispatch would
  # otherwise leave PyPI ahead of the GitHub release log.
  # GITHUB_TOKEN deliberately: releases it creates do not trigger workflows,
  # so this cannot re-enter the publish flow.
  github_release:
    name: Ensure GitHub release exists
    needs: [version, upload_pypi]
    if: always() && !cancelled() && needs.version.result == 'success' && needs.upload_pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release for the published version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release; nothing to do."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
          fi
