name: Deploy Documentation

# Publishes the Python docs (Sphinx) at the site root and the C++ reference
# (Doxygen) under /cpp/. Run it after a release is on PyPI: the Python docs are
# built against that release.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the released package and docs dependencies
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -m pip install "qoro-maestro==${version}" -r docs/sphinx/requirements.txt

      # -P keeps the checkout root off sys.path. Its maestro/ package has no
      # compiled extension, so without -P autodoc imports that and every API
      # page comes out empty, with the build still exiting 0.
      - name: Build the Python docs
        run: python -P -m sphinx -b html docs/sphinx site

      - name: Install Doxygen
        env:
          NEEDRESTART_SUSPEND: 1
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          wget -q https://www.doxygen.nl/files/doxygen-1.16.1.linux.bin.tar.gz
          tar xzf doxygen-1.16.1.linux.bin.tar.gz
          sudo cp doxygen-1.16.1/bin/doxygen /usr/local/bin/
          doxygen --version

      - name: Build the C++ reference
        run: |
          doxygen Doxyfile
          cp -r docs/html site/cpp

      # The C++ pages used to live at the site root. Keep their old URLs working
      # by redirecting each one to its new place under /cpp/. Paths Sphinx
      # already uses, including the Python guide redirects, are left alone.
      - name: Redirect old C++ reference URLs
        run: |
          python - <<'EOF'
          import pathlib

          site = pathlib.Path("site")
          for page in (site / "cpp").rglob("*.html"):
              rel = page.relative_to(site / "cpp")
              old = site / rel
              if old.exists():
                  continue
              target = "../" * (len(rel.parts) - 1) + "cpp/" + rel.as_posix()
              old.parent.mkdir(parents=True, exist_ok=True)
              old.write_text(
                  f'<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url={target}">'
                  f'<link rel="canonical" href="{target}"><a href="{target}">Moved to the C++ reference</a>'
              )
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
