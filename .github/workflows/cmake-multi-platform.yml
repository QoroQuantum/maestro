name: Compiling and testing on Ubuntu

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_complete_test_suite:
        description: "Run complete test suite (includes heavy/restricted tests)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_complete_test_suite:
        description: "Run complete test suite (includes heavy/restricted tests)"
        type: boolean
        default: false

env:
  QCSIM_VERSION: "b545698117f353ed44c158ad68a4c7238a5e24cb"
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    # Toolchain, Boost, Eigen and Python come from .github/ci.Dockerfile.
    container:
      image: ghcr.io/qoroquantum/maestro-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    # 1. CACHE GIT DEPENDENCIES (QCSim/JSON/AER)
    - name: Cache Git Dependencies
      id: cache-git-deps
      uses: actions/cache@v5
      with:
        path: |
          QCSim
          json
          qiskit-aer
        key: ${{ runner.os }}-git-deps-qcsim${{ env.QCSIM_VERSION }}-v3

    # 2. SETUP CCACHE (only main saves; PRs and releases restore main's cache)
    - name: Restore ccache
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Configure ccache
      run: |
        ccache --max-size=500M
        ccache --set-config=compression=true
        ccache -z

    # 3. DOWNLOAD DYNAMIC DEPENDENCIES (shallow clones, only if not cached)
    - name: Download Dependencies (QCSim, JSON, AER)
      run: |
        if [ ! -d QCSim ]; then git clone https://github.com/QoroQuantum/QCSim.git; fi
        cd QCSim && git checkout ${{ env.QCSIM_VERSION }} && cd ..
        [ -d json ] || git clone --depth 1 --branch v3.11.2 https://github.com/nlohmann/json.git
        [ -d qiskit-aer ] || git clone --depth 1 https://github.com/QoroQuantum/qiskit-aer.git

    # 4. BUILD WITH CCACHE + NINJA
    - name: Run CMake
      run: |
        export QCSIM_INCLUDE_DIR=$PWD/QCSim/QCSim/
        export JSON_INCLUDE_DIR=$PWD/json/single_include
        export AER_INCLUDE_DIR=$PWD/qiskit-aer/src/

        cmake . -G Ninja \
          -DPython_EXECUTABLE="$(which python)" \
          -DBUILD_PYTHON_BINDINGS=ON \
          -DMAESTRO_ENABLE_COMPOSER=OFF \
          -DMAESTRO_BUILD_REQUEST_TESTS=ON \
          -DMAESTRO_BUILD_MPI_WORKER=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

    - name: Build
      # Simulator translation units each need several GB during compilation.
      run: ninja -j2

    - name: Run adjoint Python tests
      env:
        OMP_NUM_THREADS: "4"
      run: |
        cp maestro*.so maestro/
        python -m pytest tests/python/test_adjoint.py -q

    - name: Show ccache stats
      run: ccache -s

    - name: Save ccache
      if: github.ref == 'refs/heads/main' && steps.restore-ccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}

    - name: Run noise binding and Sinter Python tests
      env:
        OMP_NUM_THREADS: "4"
      run: |
        python -m pip install -r tests/python/requirements.txt
        # test_sinter.py skips itself when stim or sinter is missing; fail instead.
        python -c "import stim, sinter, pymatching"
        python -m pytest tests/python/test_bindings.py tests/python/test_sinter.py -q -rs

    - name: Run tests
      run: |
        if [ "${{ inputs.run_complete_test_suite }}" = "true" ]; then
          echo "Running complete test suite..."
          ./bin/tests --log_level=test_suite \
            --run_test='!gpu_simulator_tests:!MPSSwapOptTests:!circuit_tests/RandomCircuitsTest*:!circuit_tests/RandomCircuitsOptimizationTest*:!mps_tests/RandomCircuitsTest*:!mps_tests/RandomCircuitsTest50*:!clifford_tests/RandomCircuitsTest*:!convsim_tests/RandomAerCircuitsTest*:!convsim_tests/RandomQcsimCircuitsTest*:!convsim_tests/RandomAerQcsimCircuitsTest*'
        else
          echo "Running fast test suite (excluding heavy/restricted tests)..."
          ./bin/tests --log_level=test_suite \
            --run_test='!gpu_simulator_tests:!MPSSwapOptTests:!circuit_tests/RandomCircuitsTest*:!circuit_tests/RandomCircuitsOptimizationTest*:!mps_tests/RandomCircuitsTest*:!mps_tests/RandomCircuitsTest50*:!clifford_tests/RandomCircuitsTest*:!convsim_tests/RandomAerCircuitsTest*:!convsim_tests/RandomQcsimCircuitsTest*:!convsim_tests/RandomAerQcsimCircuitsTest*:!ext_stabilizer_tests/RandomNonCliffordCircuitsTest*:!ext_stabilizer_tests/SaveRestoreMeasurementTest:!MpsNetwTests*'
        fi

    - name: Run native request contract and MPI tests
      env:
        HWLOC_COMPONENTS: -gl,-opencl
      run: ctest --test-dir . --output-on-failure -R '^maestro_request_'

    - name: Check standalone network configuration
      run: ctest --test-dir . --output-on-failure -R '^maestro_composer_integration$'

    - name: Check backend selection, tensor contractions, fusion, and sampling
      run: ctest --test-dir . --output-on-failure -R '^(backend_specialization|tensor_contractions|gate_fusion_tests|fusion_routing_tests|gpu_registry|sampling_order|causal_cone|parity_reduction)$'

  adjoint-windows:
    name: Adjoint tests (Windows)
    runs-on: windows-2022
    env:
      BOOST_ROOT: ${{ github.workspace }}/build/adjoint-deps/boost
      OMP_NUM_THREADS: "4"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Python test dependencies
      run: python -m pip install pytest numpy

    - name: Cache Boost
      id: cache-boost
      uses: actions/cache@v5
      with:
        path: ${{ env.BOOST_ROOT }}
        key: windows-2022-adjoint-boost-1.92.0

    - name: Download Boost
      if: steps.cache-boost.outputs.cache-hit != 'true'
      run: |
        $deps = Split-Path -Parent $env:BOOST_ROOT
        New-Item -ItemType Directory -Force -Path $deps | Out-Null
        $archive = Join-Path $deps 'boost.tar.gz'
        curl.exe -sSfL --retry 5 -o $archive https://github.com/MarkusJx/prebuilt-boost/releases/download/1.92.0/boost-1.92.0-windows-2022-msvc-shared-x86.tar.gz
        if ($LASTEXITCODE -ne 0) { throw "Boost download failed" }
        # bsdtar can return 1 for empty-name entries; verify the extracted config.
        tar.exe -xzf $archive -C $deps
        if (-not (Test-Path "$env:BOOST_ROOT/lib/cmake/Boost-1.92.0/BoostConfig.cmake")) { throw "Boost extraction failed" }
        $global:LASTEXITCODE = 0

    - name: Configure CPU Python bindings
      run: >-
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        -DCOMPILE_TESTS=OFF -DENABLE_QISKIT_AER=OFF -DBUILD_PYTHON_BINDINGS=ON
        "-DPython_EXECUTABLE=$((Get-Command python).Source)"

    - name: Build Python bindings
      run: cmake --build build --config Release --target maestro_py --parallel 2 -- /nodeReuse:false

    - name: Run adjoint Python tests
      run: |
        Copy-Item build/Release/maestro*.pyd maestro/
        python -c "import os, pytest; dll_dirs = [os.add_dll_directory(os.path.abspath('build/bin')), os.add_dll_directory(os.path.join(os.environ['BOOST_ROOT'], 'bin'))]; raise SystemExit(pytest.main(['tests/python/test_adjoint.py', '-q']))"
